<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stratigraphic Column</title>
    <!--
      Standalone full-chart viewer for the "Geologic History of Utah" strat
      columns (ALL-5470). The map readout's corner icon and the lightbox's
      "New tab" control open this page (strat/chart.html?id=N) instead of the
      raw image, so the full column can be shown alongside its citation and a
      link to the bookstore - a raw image tab can carry neither.

      Chart data comes from the committed strat/chart_localities.geojson snapshot
      (same dir, same origin). The chart set is a fixed printed book, so reading
      the snapshot by chart_id is safe - but the map layer sources chart_id live
      from the warehouse features service, so regenerate this snapshot whenever
      that serving table changes or the new-tab links will mismatch.
    -->
    <style>
        :root { --ugs-blue: #0079c1; --ink: #222; --muted: #555; }
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body {
            font: 14px/1.45 HelveticaNeue, Helvetica, Arial, sans-serif;
            color: var(--ink);
            background: #f4f5f6;
        }
        header {
            position: sticky;
            top: 0;
            z-index: 2;
            background: #fff;
            border-bottom: 1px solid #dcdfe2;
            padding: 10px 16px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
        }
        h1 {
            margin: 0 0 3px 0;
            font-size: 16px;
            font-weight: 700;
        }
        .citation {
            margin: 0;
            font-size: 12px;
            color: var(--muted);
        }
        .bookstore {
            display: inline-block;
            margin-top: 5px;
            font-size: 12px;
            font-weight: 600;
            color: var(--ugs-blue);
            text-decoration: none;
        }
        .bookstore:hover { text-decoration: underline; }
        .ext {
            display: inline-block;
            width: 11px;
            height: 11px;
            margin-left: 2px;
            vertical-align: -1px;
        }
        main { padding: 14px 16px 24px; text-align: center; }
        main img {
            max-width: 100%;
            height: auto;
            border: 1px solid #cfd3d6;
            border-radius: 3px;
            background: #fff;
            display: block;
        }
        /* Column-only view by default (ALL-5470 follow-up): the book prints a
           references/citation paragraph below each chart's own bottom border,
           clipped here and revealed on demand. #chartFrame's max-height is set
           in JS from the image's rendered height * column_height_frac once it
           loads; charts with no computed frac (see compute_column_height.py)
           get no cap and just show the full image. The cut lands exactly on
           the chart's own printed border (that's what column_height_frac
           finds), so no fade is needed to soften it - a fade would just dim
           real column content sitting right above the line. */
        #chartFrame {
            position: relative;
            display: inline-block;
            overflow: hidden;
        }
        #referencesToggle {
            display: none;
            margin: 5px 0 0;
            font: 600 11px/1 HelveticaNeue, Helvetica, Arial, sans-serif;
            color: var(--muted);
            background: none;
            border: none;
            padding: 3px 2px;
            cursor: pointer;
        }
        #referencesToggle:hover, #referencesToggle:focus-visible { color: var(--ugs-blue); }
        #referencesToggle[aria-expanded="false"]::after { content: " \25BE"; }
        #referencesToggle[aria-expanded="true"]::after { content: " \25B4"; }
        .message {
            max-width: 640px;
            margin: 48px auto;
            padding: 0 20px;
            text-align: center;
            color: var(--muted);
        }
        .message a { color: var(--ugs-blue); }
    </style>
</head>
<body>
    <header id="head" hidden>
        <h1 id="title"></h1>
        <p class="citation" id="citation"></p>
        <a class="bookstore" id="bookstore" target="_blank" rel="noopener">
            Full publication available at The Natural Resources Map &amp; Bookstore<svg
                class="ext" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                aria-hidden="true"><path d="M14 3h7v7"/><path d="M10 14 21 3"/><path
                d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>
        </a>
    </header>
    <main id="main"></main>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var id = parseInt(params.get("id"), 10);

            function fail(msg, feature) {
                // Fail loud: a bad or missing id gets a clear message, and the
                // bookstore link still shows when any feature carried its URL.
                var main = document.getElementById("main");
                var link = feature && feature.source_url
                    ? ' <a href="' + encodeURI(feature.source_url) + '" target="_blank" ' +
                      'rel="noopener">Visit The Natural Resources Map &amp; Bookstore</a>.'
                    : "";
                main.innerHTML = '<p class="message">' + msg + link + '</p>';
            }

            if (!id && id !== 0) {
                fail("No chart specified.");
                return;
            }

            fetch("chart_localities.geojson")
                .then(function (r) {
                    if (!r.ok) throw new Error("geojson " + r.status);
                    return r.json();
                })
                .then(function (fc) {
                    var feats = (fc.features || []).map(function (f) { return f.properties; });
                    var p = feats.filter(function (a) { return Number(a.chart_id) === id; })[0];
                    if (!p) {
                        fail("Chart " + id + " was not found.", feats[0]);
                        return;
                    }
                    render(p);
                })
                .catch(function (e) {
                    console.error("chart viewer:", e);
                    fail("Unable to load the chart index.");
                });

            function render(p) {
                document.title = "Chart " + p.chart_id + " — " + p.chart_title;

                var titleEl = document.getElementById("title");
                titleEl.textContent = "Chart " + p.chart_id + " — " + p.chart_title;

                // Citation mirrors the map readout panel (showStratChart): the
                // edition and page count are constants of this one book.
                var cite = document.getElementById("citation");
                cite.innerHTML =
                    escapeHtml(p.source_authors) + ", " + escapeHtml(String(p.source_year)) +
                    ", <i>" + escapeHtml(p.source_title) + "</i> (2nd ed.): " +
                    escapeHtml(p.source_publisher) + ", 266 p.";

                var store = document.getElementById("bookstore");
                if (p.source_url) {
                    store.href = p.source_url;
                } else {
                    store.hidden = true;
                }

                document.getElementById("head").hidden = false;

                var frame = document.createElement("div");
                frame.id = "chartFrame";

                var img = document.createElement("img");
                img.alt = "Stratigraphic column, chart " + p.chart_id + ", " +
                          p.chart_title + " - full chart from Geologic History of Utah";
                // Fail loud if the image asset is missing, rather than leaving a
                // broken-image icon under an otherwise-fine page.
                img.onerror = function () {
                    document.getElementById("main").innerHTML =
                        '<p class="message">The chart image could not be loaded.</p>';
                };

                var main = document.getElementById("main");
                var frac = Number(p.column_height_frac);
                // A chart with no computed column_height_frac (see
                // compute_column_height.py - either no confident rule found, or
                // the region below it isn't a plain text references block) shows
                // in full, uncapped.
                if (frac > 0 && frac < 1) {
                    var toggle = document.createElement("button");
                    toggle.id = "referencesToggle";
                    toggle.type = "button";
                    toggle.textContent = "Show chart's references";
                    toggle.setAttribute("aria-controls", "chartFrame");
                    toggle.setAttribute("aria-expanded", "false");
                    // Reads img.clientHeight live (NOT naturalHeight, and NOT
                    // cached) - main img is max-width:100%/height:auto, so its
                    // rendered height tracks viewport width. A cached value would
                    // drift out of sync with the chart's actual bottom border
                    // after a resize or orientation change.
                    var applyCap = function () {
                        frame.style.maxHeight = Math.round(img.clientHeight * frac) + "px";
                    };
                    img.onload = function () {
                        applyCap();
                        frame.classList.add("capped");
                        toggle.style.display = "inline-block";
                    };
                    toggle.onclick = function () {
                        var showing = frame.classList.toggle("capped");
                        if (showing) applyCap(); else frame.style.maxHeight = "none";
                        toggle.textContent = showing ? "Show chart's references" : "Hide chart's references";
                        toggle.setAttribute("aria-expanded", showing ? "false" : "true");
                    };
                    window.addEventListener("resize", function () {
                        if (frame.classList.contains("capped")) applyCap();
                    });
                    main.appendChild(toggle);
                }

                img.src = p.image_url;
                frame.appendChild(img);
                main.insertBefore(frame, main.firstChild);
            }

            function escapeHtml(s) {
                return String(s == null ? "" : s)
                    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            }
        })();
    </script>
</body>
</html>
